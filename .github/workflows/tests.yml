name: Tests

# The repo had no test job at all until now — only the image build. Anything
# under connito/ can therefore break the CPU suite without CI noticing.
#
# CPU only, and deliberately so: nothing here may download DeepSeek-V2-Lite
# (~29 GB) or need a GPU. Heavy tests opt in behind an env var, e.g.
# RUN_DEEPSEEK_V2_LITE_TEST, and stay skipped here.

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        # CPU torch wheels: the CUDA build in requirements.txt is ~2.5 GB and
        # buys nothing on a GitHub runner.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          pip install -r requirements.txt

      - name: Run tests
        # Four tests already fail on master and are stale rather than broken
        # code. They are deselected explicitly — not xfail-ed, not skipped in
        # the files themselves — so the list stays visible here and shrinks as
        # each is triaged. Fixing them needs decisions outside this change:
        #
        #   test_reserve_owner_share_*          expects an owner reserve of
        #                                       0.05; the code now yields 0.25.
        #                                       Which is correct is a subnet
        #                                       economics call.
        #   ..._download_concurrency_...        expects CheckpointCfg
        #                                       .download_concurrency == 4; the
        #                                       default is now 1.
        #   test_checkpoint_precision_...       expects backbone keys to survive
        #                                       a shard round-trip; backbone
        #                                       params are deliberately no
        #                                       longer persisted.
        run: |
          python -m pytest connito/test \
            --deselect connito/test/test_fallback_weights_peer_consensus.py::test_reserve_owner_share_normal_case \
            --deselect connito/test/test_fallback_weights_peer_consensus.py::test_reserve_owner_share_owner_already_present \
            --deselect connito/test/test_hf_distribution_safety.py::test_checkpoint_cfg_restores_download_concurrency_for_compatibility \
            --deselect connito/test/test_precision_fixes.py::test_checkpoint_precision_preservation
