# Example optimizer-parameter sweep.
#
# Explores AdamW beta1/beta2 jointly with the existing lr knob.
# Useful to verify the (0.9, 0.95) default is well-conditioned for
# the DeepSeek-V2-Lite MoE setup.

sweep_name: optimizer_search_2026_05
base_config: null

mini_train:
  steps: 100
  base_model: deepseek-ai/DeepSeek-V2-Lite
  expert_group: exp_math
  dry_run_stub_model: false

local_scorer:
  max_batches: 20
  seeds: [42, 1337, 314159]
  baseline_loss: 4.78

grid:
  - param: opt.lr
    values: [5.0e-6, 1.0e-5, 3.0e-5]
  # `opt.adam_beta1` / `opt.adam_beta2` are forward-compat hooks: the
  # current `OptimizerCfg` does not surface betas, so adding them as
  # overrides only takes effect after a follow-up unit adds the
  # corresponding pydantic fields. The sweep harness applies the
  # override blindly and the (future) `MinerConfig` consumer reads it.
  - param: opt.adam_beta1
    values: [0.9, 0.95]
  - param: opt.adam_beta2
    values: [0.95, 0.99]

output_dir: bench/sweep_results/optimizer_search_2026_05
