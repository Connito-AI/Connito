global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'mycelia_validator_metrics'
    static_configs:
      # Expecting validator 0 on 8200, validator 1 on 8201, etc.
      - targets: ['localhost:8200', 'localhost:8201', 'localhost:8120']

  - job_name: 'mycelia_miner_metrics'
    static_configs:
      # Expecting miner 0 on 8100, miner 1 on 8101, etc.
      - targets: ['localhost:8100']

  - job_name: 'mycelia_owner_eval'
    static_configs:
      # Standalone owner eval daemon (connito.owner_eval). Publishes owner_eval_*
      # metrics on eval_pipeline.telemetry_port (default 8400). Point this at the
      # host:port where the owner runs the daemon.
      - targets: ['localhost:8400']
