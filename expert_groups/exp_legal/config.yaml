group_id: 2
expert_group_name: "exp_legal"
data:
  dataset_sources:
    - path: "joelniklaus/Multi_Legal_Pile"
      name: "en_all"
      weight: 0.5
      text_column: "text"
      # Required: Multi_Legal_Pile ships a custom builder script
      # (joelniklaus/Multi_Legal_Pile/Multi_Legal_Pile.py) that HF
      # refuses to execute without explicit opt-in. The flag is
      # per-source (see config.DatasetSourceCfg comment) so only
      # this dataset gets remote-code authorization; c4 below stays
      # off. When seeded shard-pick is wired up for this source,
      # also pin the revision via `eval_source_revision_pin` to
      # bound the executed code to a reviewed SHA.
      trust_remote_code: true
    - path: "allenai/c4"
      name: "en"
      weight: 0.5
      text_column: "text"
  per_device_train_batch_size: 1
  batch_size: 4
  sequence_length: 4096
  world_size: 10
  rank: 1
  dataset_class: "expert_groups.exp_legal.dataset:StreamingTorchDataset"
  # TODO(exp-legal-launch): register (joelniklaus/Multi_Legal_Pile, en_all)
  # in connito/shared/eval_shard_pick.py:_KNOWN_SOURCES with verified
  # shard rows, then flip this back to true. Until then, the validator's
  # legacy head-of-stream eval path is used for this group; consensus
  # determinism across validators is weaker than the seeded-pick guarantee
  # exp_math already enjoys. See docs/exp-legal-migration-plan.md §2.
  eval_source_seeded_shard_pick: false
